name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Home Assistant releases monthly and hassfest rules change with it. A
    # weekly run surfaces a breakage before a user does.
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images live in home-assistant/brands, which needs a separate
          # PR. Ignore the check until that has been merged, then delete this.
          ignore: brands
